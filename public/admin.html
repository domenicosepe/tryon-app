<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TryOn Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-box h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-box p{font-size:13px;color:#888;margin-bottom:24px}
input{display:block;width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit;transition:border .15s}
input:focus{border-color:#1a1a1a}
.err{color:#c0392b;font-size:13px;text-align:center;margin-top:6px}

/* Layout */
.dash{display:none}
.topbar{background:#1a1a1a;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.content{padding:20px;max-width:1300px;margin:0 auto}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center;border:1px solid #eee}
.stat .num{font-size:26px;font-weight:700}
.stat .lbl{font-size:11px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.stat.green .num{color:#27ae60}
.stat.orange .num{color:#e67e22}
.stat.red .num{color:#c0392b}
.stat.gold .num{color:#C9A84C}
.stat.blue .num{color:#2980b9}

/* Semafori legenda */
.legend{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#888}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.green{background:#27ae60}
.dot.yellow{background:#f39c12}
.dot.red{background:#e74c3c}
.dot.grey{background:#bbb}

/* Filtri */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{padding:6px 14px;border:1.5px solid #ddd;border-radius:99px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.filters button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* Tabella */
.table-wrap{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#f8f8f6;padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:12px 14px;font-size:13px;border-top:1px solid #f0f0ee;vertical-align:middle}
tr:hover td{background:#fafafa}

/* Semaforo pagamento */
.semaforo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.semaforo .led{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px rgba(0,0,0,.2)}
.led-green{background:#27ae60;box-shadow:0 0 8px rgba(39,174,96,.5)}
.led-yellow{background:#f39c12;box-shadow:0 0 8px rgba(243,156,18,.5)}
.led-red{background:#e74c3c;box-shadow:0 0 8px rgba(231,76,60,.5)}
.led-grey{background:#bbb}

/* Badge */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.active{background:#d5f5e3;color:#1e8449}
.badge.pending{background:#fdebd0;color:#d35400}
.badge.blocked{background:#fadbd8;color:#c0392b}
.badge.cancelled{background:#eee;color:#888}
.badge.basic{background:#e8f4f8;color:#2980b9}
.badge.pro{background:#e8f8f5;color:#1abc9c}
.badge.premium{background:#f5eef8;color:#8e44ad}

/* Barra crediti */
.cred-bar{background:#eee;border-radius:99px;height:5px;width:70px;overflow:hidden;margin-top:3px}
.cred-fill{height:100%;border-radius:99px}

/* Azioni */
.actions{display:flex;gap:5px;flex-wrap:wrap}
.btn{padding:7px 12px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-success{background:#27ae60;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-grey{background:#eee;color:#555}
.btn-blue{background:#2980b9;color:#fff}
.btn-primary{background:#1a1a1a;color:#fff;display:block;width:100%;padding:12px;font-size:14px;border-radius:8px;margin-bottom:10px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:400px;max-width:95vw}
.modal h2{font-size:17px;font-weight:700;margin-bottom:4px}
.modal p{font-size:13px;color:#888;margin-bottom:18px}
.modal label{font-size:13px;font-weight:500;display:block;margin-bottom:5px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}

.empty{text-align:center;padding:40px;color:#888;font-size:13px}
.mrr-box{background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.mrr-box .mrr-val{font-size:32px;font-weight:800}
.mrr-box .mrr-lbl{font-size:12px;opacity:.7;margin-top:2px}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <h1>TryOn Admin</h1>
    <p>Gestione abbonamenti e pagamenti</p>
    <input type="text"     id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button class="btn-primary" onclick="login()" style="margin-top:4px">Accedi</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dash" id="dash">
  <div class="topbar">
    <h1>🧥 TryOn Admin</h1>
    <div class="topbar-right">
      <span style="font-size:12px;color:rgba(255,255,255,.5)" id="last-update"></span>
      <button onclick="loadAll()">↻</button>
      <button onclick="logout()">Esci</button>
    </div>
  </div>

  <div class="content">

    <!-- MRR -->
    <div class="mrr-box">
      <div>
        <div class="mrr-lbl">Entrate mensili ricorrenti (MRR)</div>
        <div class="mrr-val" id="mrr">€0</div>
      </div>
      <div style="font-size:40px">💰</div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Legenda semafori -->
    <div class="legend">
      <span style="font-size:12px;font-weight:600;color:#555">Stato pagamento:</span>
      <div class="legend-item"><div class="dot green"></div> Pagato — attivo</div>
      <div class="legend-item"><div class="dot yellow"></div> In scadenza (≤3 giorni)</div>
      <div class="legend-item"><div class="dot red"></div> Scaduto / non pagato</div>
      <div class="legend-item"><div class="dot grey"></div> In attesa / sospeso</div>
    </div>

    <!-- Filtri -->
    <div class="filters">
      <button class="active" onclick="filter('all',this)">Tutti</button>
      <button onclick="filter('pending',this)">⏳ In attesa</button>
      <button onclick="filter('active',this)">✅ Attivi</button>
      <button onclick="filter('blocked',this)">🚫 Bloccati</button>
      <button onclick="filter('expiring',this)">⚡ In scadenza</button>
      <button onclick="filter('overdue',this)">🔴 Scaduti</button>
    </div>

    <!-- Tabella -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pagamento</th>
            <th>Negozio</th>
            <th>Piano</th>
            <th>Stato</th>
            <th>Crediti usati</th>
            <th>Scadenza</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Approva -->
<div class="modal-bg" id="modal-approve">
  <div class="modal">
    <h2>✅ Approva negozio</h2>
    <p id="approve-desc"></p>
    <label>Data prossimo pagamento</label>
    <input type="date" id="approve-date" style="margin-bottom:0"/>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="confirmApprove()">Approva</button>
      <button class="btn btn-grey" onclick="closeModal('modal-approve')">Annulla</button>
    </div>
  </div>
</div>

<!-- Modal Note -->
<div class="modal-bg" id="modal-notes">
  <div class="modal">
    <h2>📝 Note</h2>
    <textarea id="notes-text" rows="4" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:inherit;font-size:13px;resize:vertical;outline:none"></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" style="flex:1" onclick="saveNotes()">Salva</button>
      <button class="btn btn-grey" onclick="closeModal('modal-notes')">Annulla</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let TOKEN = localStorage.getItem('admin_token');
let shops = [];
let currentFilter = 'all';
let activeId = null;

// ── Auth ─────────────────────────────────────────────────
async function login() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  try {
    const res  = await fetch(`${API}/api/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username:u, password:p }),
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('login-err').textContent = data.error; return; }
    TOKEN = data.token;
    localStorage.setItem('admin_token', TOKEN);
    showDash();
  } catch { document.getElementById('login-err').textContent = 'Errore connessione'; }
}

function logout() {
  localStorage.removeItem('admin_token'); TOKEN = null;
  document.getElementById('dash').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'flex';
}

async function showDash() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  await loadAll();
  setInterval(loadAll, 30000);
}

if (TOKEN) showDash();

// ── Carica dati ──────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadStats(), loadShops()]);
  document.getElementById('last-update').textContent =
    'Aggiornato ' + new Date().toLocaleTimeString('it-IT');
}

async function loadStats() {
  const res  = await fetch(`${API}/api/admin/stats`, { headers: auth() });
  const d    = await res.json();

  document.getElementById('mrr').textContent = '€' + (parseInt(d.mrr)||0).toLocaleString('it-IT');

  document.getElementById('stats').innerHTML = `
    <div class="stat green"><div class="num">${d.active||0}</div><div class="lbl">Attivi</div></div>
    <div class="stat orange"><div class="num">${d.pending||0}</div><div class="lbl">In attesa</div></div>
    <div class="stat red"><div class="num">${d.blocked||0}</div><div class="lbl">Bloccati</div></div>
    <div class="stat blue"><div class="num">${d.basic||0}</div><div class="lbl">Basic</div></div>
    <div class="stat blue"><div class="num">${d.pro||0}</div><div class="lbl">Pro</div></div>
    <div class="stat gold"><div class="num">${d.premium||0}</div><div class="lbl">Premium</div></div>
    <div class="stat"><div class="num">${d.total_calls||0}</div><div class="lbl">Generazioni</div></div>
  `;
}

async function loadShops() {
  const res  = await fetch(`${API}/api/admin/shops`, { headers: auth() });
  const data = await res.json();
  shops = data.shops || [];
  renderTable();
}

// ── Semaforo pagamento ────────────────────────────────────
function getSemaforo(shop) {
  const today   = new Date(); today.setHours(0,0,0,0);
  const in3days = new Date(today); in3days.setDate(in3days.getDate() + 3);

  if (shop.status === 'pending') {
    return { led: 'led-grey', label: 'In attesa', tag: 'pending' };
  }
  if (shop.status === 'blocked' || shop.status === 'cancelled') {
    return { led: 'led-red', label: shop.status === 'blocked' ? 'Sospeso' : 'Cancellato', tag: 'overdue' };
  }
  if (shop.status === 'active') {
    if (!shop.next_payment_date) {
      return { led: 'led-green', label: 'Pagato', tag: 'active' };
    }
    const scad = new Date(shop.next_payment_date); scad.setHours(0,0,0,0);
    if (scad < today) {
      return { led: 'led-red', label: 'Scaduto!', tag: 'overdue' };
    }
    if (scad <= in3days) {
      return { led: 'led-yellow', label: 'In scadenza', tag: 'expiring' };
    }
    return { led: 'led-green', label: 'Pagato', tag: 'active' };
  }
  return { led: 'led-grey', label: '—', tag: 'other' };
}

// ── Render ───────────────────────────────────────────────
function filter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  let filtered = shops;

  if (currentFilter !== 'all') {
    filtered = shops.filter(s => {
      const sem = getSemaforo(s);
      if (currentFilter === 'expiring') return sem.tag === 'expiring';
      if (currentFilter === 'overdue')  return sem.tag === 'overdue';
      return s.status === currentFilter;
    });
  }

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">Nessun negozio</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(s => {
    const sem     = getSemaforo(s);
    const credPct = s.fashn_calls_limit > 0
      ? Math.round((s.fashn_calls_used / s.fashn_calls_limit) * 100) : 0;
    const credColor = credPct > 80 ? '#e74c3c' : credPct > 50 ? '#f39c12' : '#27ae60';

    const scadStr = s.next_payment_date
      ? new Date(s.next_payment_date).toLocaleDateString('it-IT')
      : '—';

    return `<tr>
      <td>
        <div class="semaforo">
          <div class="led ${sem.led}"></div>
          <span>${sem.label}</span>
        </div>
      </td>
      <td>
        <strong>${s.shop_domain}</strong><br>
        <span style="font-size:11px;color:#aaa">${s.email||''}</span>
        ${s.notes ? `<br><span style="font-size:11px;color:#C9A84C">📝 ${s.notes.substring(0,25)}${s.notes.length>25?'…':''}</span>` : ''}
      </td>
      <td><span class="badge ${s.plan}">${s.plan||'—'}</span></td>
      <td><span class="badge ${s.status}">${s.status}</span></td>
      <td>
        <div style="font-size:12px;color:#888">${s.fashn_calls_used}/${s.fashn_calls_limit}</div>
        <div class="cred-bar">
          <div class="cred-fill" style="width:${credPct}%;background:${credColor}"></div>
        </div>
      </td>
      <td style="font-size:13px;font-weight:${sem.tag==='overdue'?'700':'400'};color:${sem.tag==='overdue'?'#e74c3c':sem.tag==='expiring'?'#f39c12':'#555'}">
        ${scadStr}
      </td>
      <td class="actions">
        ${s.status !== 'active'
          ? `<button class="btn btn-success" onclick="openApprove(${s.id},'${s.shop_domain}','${s.plan}')">✓ Approva</button>` : ''}
        ${s.status === 'active'
          ? `<button class="btn btn-blue" onclick="openApprove(${s.id},'${s.shop_domain}','${s.plan}')">↻ Rinnova</button>` : ''}
        ${s.status !== 'blocked' && s.status !== 'cancelled'
          ? `<button class="btn btn-danger" onclick="blockShop(${s.id})">✗</button>` : ''}
        <button class="btn btn-grey" onclick="openNotes(${s.id},'${(s.notes||'').replace(/'/g,"\\'")}')">📝</button>
      </td>
    </tr>`;
  }).join('');
}

// ── Azioni ────────────────────────────────────────────────
function openApprove(id, domain, plan) {
  activeId = id;
  document.getElementById('approve-desc').textContent = `${domain} — piano ${plan}`;
  const next = new Date(); next.setMonth(next.getMonth() + 1);
  document.getElementById('approve-date').value = next.toISOString().split('T')[0];
  document.getElementById('modal-approve').classList.add('show');
}

async function confirmApprove() {
  const date = document.getElementById('approve-date').value;
  await fetch(`${API}/api/admin/shops/${activeId}/approve`, {
    method:'POST', headers: auth(),
    body: JSON.stringify({ next_payment_date: date }),
  });
  closeModal('modal-approve');
  toast('✓ Approvato — semaforo verde');
  loadAll();
}

async function blockShop(id) {
  if (!confirm('Bloccare questo negozio?')) return;
  await fetch(`${API}/api/admin/shops/${id}/block`, { method:'POST', headers: auth() });
  toast('Negozio bloccato — semaforo rosso');
  loadAll();
}

function openNotes(id, notes) {
  activeId = id;
  document.getElementById('notes-text').value = notes;
  document.getElementById('modal-notes').classList.add('show');
}

async function saveNotes() {
  const notes = document.getElementById('notes-text').value;
  await fetch(`${API}/api/admin/shops/${activeId}/notes`, {
    method:'POST', headers: auth(),
    body: JSON.stringify({ notes }),
  });
  closeModal('modal-notes');
  toast('Note salvate');
  loadShops();
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function auth() { return { 'Authorization':`Bearer ${TOKEN}`, 'Content-Type':'application/json' }; }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.querySelectorAll('.modal-bg').forEach(m =>
  m.addEventListener('click', e => { if(e.target===m) m.classList.remove('show'); })
);
</script>
</body>
</html>
