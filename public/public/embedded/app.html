<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryStyleAI</title>
  <!-- Shopify App Bridge -->
  <script src="https://unpkg.com/@shopify/app-bridge@3"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f6f7;
      color: #202223;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #e1e3e5;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #7b2ff7, #00c6ff);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 14px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .container { padding: 24px; max-width: 960px; margin: 0 auto; }

    /* Status banner */
    .status-banner {
      background: #fff;
      border: 1px solid #e1e3e5;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
    }
    .badge-active { background: #d4edda; color: #155724; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-cancelled { background: #f8d7da; color: #721c24; }
    .badge-none { background: #e2e3e5; color: #383d41; }

    /* Usage card */
    .usage-card {
      background: #fff;
      border: 1px solid #e1e3e5;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .usage-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #6d7175; text-transform: uppercase; letter-spacing: 0.05em; }
    .usage-numbers {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;
    }
    .usage-stat { text-align: center; }
    .usage-stat .value { font-size: 32px; font-weight: 700; color: #7b2ff7; }
    .usage-stat .label { font-size: 12px; color: #6d7175; margin-top: 4px; }
    .progress-wrap { margin-top: 16px; }
    .progress-bar {
      height: 8px; background: #e1e3e5; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7b2ff7, #00c6ff);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #6d7175; margin-top: 6px; }

    /* Piano cards */
    .plans-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;
      margin-bottom: 20px;
    }
    .plan-card {
      background: #fff;
      border: 2px solid #e1e3e5;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      transition: border-color 0.2s;
    }
    .plan-card.active { border-color: #7b2ff7; }
    .plan-card.popular::before {
      content: 'Più popolare';
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: #7b2ff7; color: white; font-size: 11px; font-weight: 600;
      padding: 3px 12px; border-radius: 20px;
    }
    .plan-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .plan-price { font-size: 28px; font-weight: 800; color: #7b2ff7; }
    .plan-price span { font-size: 14px; font-weight: 400; color: #6d7175; }
    .plan-calls { font-size: 13px; color: #6d7175; margin: 8px 0 16px; }
    .plan-features { list-style: none; margin-bottom: 20px; }
    .plan-features li { font-size: 13px; padding: 4px 0; color: #444; }
    .plan-features li::before { content: '✓ '; color: #7b2ff7; font-weight: bold; }
    .btn {
      display: block; width: 100%;
      padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; text-align: center; text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #7b2ff7; color: white; }
    .btn-secondary { background: #f1f2f4; color: #202223; }
    .btn-active { background: #e1e3e5; color: #6d7175; cursor: default; }
    .btn-danger { background: #fff; color: #d72c0d; border: 1px solid #d72c0d; margin-top: 8px; }

    /* Status indicator */
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #00a047; }
    .dot-yellow { background: #ffc453; }
    .dot-red { background: #d72c0d; }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .trial-note { font-size: 12px; color: #6d7175; text-align: center; margin-top: 8px; }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: #6d7175; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e1e3e5; border-top-color: #7b2ff7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .alert-warning { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
    .alert-danger { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">TS</div>
  <h1>TryStyleAI</h1>
</div>

<div class="container">
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      Caricamento...
    </div>
  </div>
</div>

<script>
  // Inizializza App Bridge
  const AppBridge = window['app-bridge'];
  const createApp = AppBridge.default;

  const urlParams = new URLSearchParams(window.location.search);
  const shop = urlParams.get('shop') || urlParams.get('embedded') || window.shopOrigin;
  const host = urlParams.get('host');

  let appBridge;
  try {
    appBridge = createApp({
      apiKey: '8cc69e33dd6444c334c764b246282af9',
      host: host,
      forceRedirect: true
    });
  } catch(e) {
    console.log('App Bridge init:', e.message);
  }

  // Carica dati shop
  async function loadDashboard() {
    try {
      const res = await fetch(`/api/billing/current?shop=${encodeURIComponent(shop)}`);
      if (!res.ok) throw new Error('Shop non trovato');
      const data = await res.json();
      renderDashboard(data);
    } catch(err) {
      document.getElementById('app').innerHTML = `
        <div class="alert alert-danger">Errore caricamento dati: ${err.message}</div>
        <a href="/api/shopify/install?shop=${encodeURIComponent(shop)}" class="btn btn-primary" style="max-width:200px">Reinstalla App</a>
      `;
    }
  }

  function renderDashboard(data) {
    const pct = data.callsLimit > 0 ? Math.min(100, Math.round(data.callsUsed / data.callsLimit * 100)) : 0;
    const remaining = Math.max(0, data.callsLimit - data.callsUsed);
    const statusClass = data.status === 'active' ? 'badge-active' : data.status === 'pending' ? 'badge-pending' : data.status === 'cancelled' ? 'badge-cancelled' : 'badge-none';
    const dotClass = data.status === 'active' ? 'dot-green' : data.status === 'pending' ? 'dot-yellow' : 'dot-red';

    // Avvisi scadenza
    let alert = '';
    if (data.status === 'active' && data.nextPayment) {
      const daysLeft = Math.ceil((new Date(data.nextPayment) - Date.now()) / 86400000);
      if (daysLeft <= 3) alert = `<div class="alert alert-warning">⚠️ Rinnovo abbonamento tra ${daysLeft} giorno/i</div>`;
    }
    if (data.status === 'cancelled') alert = `<div class="alert alert-danger">⛔ Abbonamento cancellato. Sottoscrivi un piano per continuare.</div>`;
    if (pct >= 90 && data.status === 'active') alert += `<div class="alert alert-warning">⚠️ Hai usato ${pct}% delle generazioni disponibili questo mese.</div>`;

    const nextPaymentStr = data.nextPayment ? new Date(data.nextPayment).toLocaleDateString('it-IT') : '—';

    // Piano corrente
    const currentPlanSection = data.plan !== 'none' ? `
      <div class="usage-card">
        <h2>Utilizzo questo mese</h2>
        <div class="usage-numbers">
          <div class="usage-stat"><div class="value">${data.callsUsed}</div><div class="label">Generazioni usate</div></div>
          <div class="usage-stat"><div class="value">${remaining}</div><div class="label">Rimaste</div></div>
          <div class="usage-stat"><div class="value">${data.callsLimit}</div><div class="label">Totale mensile</div></div>
          <div class="usage-stat"><div class="value">${nextPaymentStr}</div><div class="label">Prossimo rinnovo</div></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label"><span>${pct}% utilizzato</span><span>${remaining} rimanenti</span></div>
        </div>
        ${data.status === 'active' ? `<button class="btn btn-danger" onclick="cancelPlan()">Cancella abbonamento</button>` : ''}
      </div>
    ` : '';

    // Griglia piani
    const plansHtml = data.plans.map(p => {
      const isActive = p.key === data.plan && data.status === 'active';
      const isPopular = p.key === 'pro';
      return `
        <div class="plan-card ${isActive ? 'active' : ''} ${isPopular ? 'popular' : ''}">
          <div class="plan-name">${p.name}</div>
          <div class="plan-price">€${p.price}<span>/mese</span></div>
          <div class="plan-calls">${p.calls} generazioni/mese</div>
          <ul class="plan-features">
            <li>Virtual Try-On con AI</li>
            <li>Installazione automatica</li>
            <li>Dashboard analytics</li>
            ${p.key === 'pro' || p.key === 'premium' ? '<li>Supporto prioritario</li>' : ''}
            ${p.key === 'premium' ? '<li>Account manager dedicato</li>' : ''}
          </ul>
          ${isActive
            ? `<div class="btn btn-active">Piano attuale</div>`
            : `<a href="/api/billing/subscribe?shop=${encodeURIComponent(shop)}&plan=${p.key}" class="btn btn-primary">
                ${data.plan === 'none' ? `Prova gratis ${p.trialDays} giorni` : 'Passa a questo piano'}
               </a>
               <div class="trial-note">${data.plan === 'none' ? 'Poi €' + p.price + '/mese · annulla quando vuoi' : ''}</div>`
          }
        </div>
      `;
    }).join('');

    document.getElementById('app').innerHTML = `
      ${alert}
      <div class="status-banner">
        <div>
          <div style="font-size:13px;color:#6d7175;margin-bottom:4px">Negozio</div>
          <div style="font-weight:600">${data.shop}</div>
        </div>
        <div>
          <div style="font-size:13px;color:#6d7175;margin-bottom:4px">Piano</div>
          <div style="font-weight:600">${data.planName}</div>
        </div>
        <div>
          <span class="status-badge ${statusClass}">
            <span class="dot ${dotClass}"></span>
            ${data.status === 'active' ? 'Attivo' : data.status === 'pending' ? 'In attesa' : data.status === 'cancelled' ? 'Cancellato' : 'Nessun piano'}
          </span>
        </div>
      </div>
      ${currentPlanSection}
      <div class="section-title">${data.plan === 'none' ? 'Scegli il tuo piano' : 'Cambia piano'}</div>
      <div class="plans-grid">${plansHtml}</div>
    `;
  }

  async function cancelPlan() {
    if (!confirm('Vuoi davvero cancellare il tuo abbonamento? Il widget continuerà a funzionare fino alla fine del periodo.')) return;
    try {
      const res = await fetch('/api/billing/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shop })
      });
      if (res.ok) loadDashboard();
    } catch(err) {
      alert('Errore durante la cancellazione');
    }
  }

  if (shop) {
    loadDashboard();
  } else {
    document.getElementById('app').innerHTML = `<div class="alert alert-danger">Parametro shop mancante. Apri l'app dall'admin Shopify.</div>`;
  }
</script>
</body>
</html>
